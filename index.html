<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guest Reply Assistant</title>
<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#17211d;--sub:#5d6b65;--line:#d7dedb;--acc:#0f5c4a;--accink:#fff;--soft:#e4efeb;--warn:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#101715;--panel:#18211e;--ink:#e8efec;--sub:#9db0a8;--line:#2c3a35;--acc:#5fc4a6;--accink:#08201a;--soft:#1f2f2a;--warn:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Hiragino Sans","Noto Sans JP","Noto Sans KR",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:16px}
.hero{position:relative;height:190px;border-radius:12px;overflow:hidden;margin-bottom:14px;background:#0b4d8c url(hero.jpg) center 62%/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,20,15,.55))}
.logo{position:absolute;left:12px;bottom:12px;z-index:1;background:#fff;border-radius:8px;padding:2px 8px;height:76px}
.logo img{height:100%;display:block}
h1{font-size:19px;margin:0 0 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:13px;color:var(--sub);display:block;margin:8px 0 2px}
select,input,textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{width:100%;resize:vertical}
input[type=password],input[type=text]{width:100%}
button{cursor:pointer}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
#mic{width:72px;height:72px;border-radius:50%;font-size:28px;flex:none}
#mic.on{background:var(--warn);border-color:var(--warn);color:#fff}
#heard{flex:1;min-width:200px}
.card{border-left:5px solid var(--acc);background:var(--panel);border-radius:8px;border:1px solid var(--line);border-left-width:5px;padding:12px;margin-bottom:10px}
.tag{font-size:13px;color:var(--sub)}
.guest{font-size:22px;line-height:1.45;margin:4px 0;font-weight:600}
.staff{color:var(--ink);font-size:16px;margin:4px 0 8px;padding:6px 8px;background:var(--soft);border-radius:6px}
.pron{font-size:17px;color:var(--acc);margin:0 0 4px}
.note{font-size:13px;color:var(--sub)}
.err{color:var(--warn);font-size:14px}
.gloss{background:var(--soft);border-radius:8px;padding:10px;margin-bottom:10px}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main>
<div class="hero"><div class="logo"><img src="logo.png" alt="Kawana Hotel"></div></div>
<h1 id="ttl"></h1>

<section class="panel">
  <div class="row">
    <div><label id="lGuest"></label><select id="gLang"></select></div>
    <div><label id="lStaff"></label><select id="sLang"></select></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button id="mic" aria-label="mic">🎤</button>
    <textarea id="heard" rows="3"></textarea>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="pri" id="go"></button>
    <button id="clr"></button>
    <span class="err" id="err"></span>
  </div>
  <p class="note" id="micNote"></p>
</section>

<section id="out"></section>

<details class="panel">
  <summary id="sumSet"></summary>
  <label id="lProv"></label>
  <select id="prov"><option value="c">Claude (Anthropic)</option><option value="g">Gemini (Google, free tier)</option></select>
  <label id="lKey"></label>
  <input type="password" id="key" autocomplete="off">
  <label id="lModel"></label>
  <input type="text" id="model">
  <p class="note" id="pnote"></p>
  <label id="lTerms"></label>
  <textarea id="terms" rows="6"></textarea>
  <label id="lInfo"></label>
  <textarea id="info" rows="14"></textarea>
  <div class="row" style="margin-top:8px">
    <button id="save" class="pri"></button>
    <button id="exp"></button>
    <button id="imp"></button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
  <p class="note" id="priv"></p>
</details>
</main>

<script>
const LANGS=[["ja","日本語","ja-JP"],["en","English","en-US"],["ko","한국어","ko-KR"],["zh","中文(简体)","zh-CN"],["zh-TW","中文(繁體)","zh-TW"],["th","ไทย","th-TH"],["vi","Tiếng Việt","vi-VN"],["id","Bahasa Indonesia","id-ID"],["ms","Bahasa Melayu","ms-MY"],["tl","Filipino","fil-PH"],["hi","हिन्दी","hi-IN"],["es","Español","es-ES"],["fr","Français","fr-FR"],["de","Deutsch","de-DE"],["it","Italiano","it-IT"],["pt","Português","pt-BR"],["ru","Русский","ru-RU"],["ar","العربية","ar-SA"]];
const UI={
ja:{t:"接客返答アシスタント",g:"お客様の言語",s:"スタッフの言語",ph:"お客様の言葉がここに表示されます(直接入力も可)",go:"返答を作る",clr:"クリア",set:"設定(ホテル情報・APIキー)",key:"Anthropic APIキー",model:"モデル名",terms:"用語集(聞き間違えやすい言葉と正しい意味)",info:"ホテル情報(施設の場所・時間・ルール・FAQ)",save:"保存",exp:"書き出し",imp:"読み込み",saved:"保存しました",priv:"設定はこの端末のブラウザにのみ保存されます。お客様の氏名・部屋番号・カード情報は入力しないでください。AIの回答は必ずスタッフが内容を確認してから使ってください。",mic:"マイクは選択した「お客様の言語」で認識します。言語が分からない時は文字入力すれば自動判定します。",heard:"お客様の発言",fix:"聞き取り補正",free:"Gemini無料枠で送った内容は、Googleの製品改善に使われる可能性があります。氏名・部屋番号・カード情報は絶対に入力せず、会社の許可を確認してください。モデル名はGoogle AI Studioで確認した名前に変更できます。",said:"意味",speak:"読み上げ",copy:"コピー",noKey:"設定でAPIキーを入力してください",listen:"聞き取り中…",fail:"エラー",nomic:"このブラウザは音声認識に未対応です(Chrome/Safari推奨)。文字入力を使ってください。",auto:"自動判定(文字入力)",busy:"考え中…"},
en:{t:"Guest Reply Assistant",g:"Guest language",s:"Staff language",ph:"The guest's words appear here (you can also type)",go:"Suggest replies",clr:"Clear",set:"Settings (hotel info, API key)",key:"Anthropic API key",model:"Model name",terms:"Glossary (often misheard words and what they mean)",info:"Hotel info (locations, hours, rules, FAQ)",save:"Save",exp:"Export",imp:"Import",saved:"Saved",priv:"Settings stay in this browser only. Never enter guest names, room numbers or card details. Staff must review every AI reply before using it.",mic:"The mic recognizes the selected guest language. If unsure, type the text and the language is auto-detected.",heard:"Guest said",fix:"Corrected transcript",free:"On the Gemini free tier, requests may be used to improve Google products. Never enter names, room numbers or card details, and check company policy. You can replace the model name with one shown in Google AI Studio.",said:"Meaning",speak:"Speak",copy:"Copy",noKey:"Enter your API key in Settings",listen:"Listening…",fail:"Error",nomic:"Speech recognition isn't supported here (use Chrome/Safari). Type instead.",auto:"Auto-detect (typing)",busy:"Thinking…"},
ko:{t:"고객 응대 어시스턴트",g:"손님 언어",s:"직원 언어",ph:"손님의 말이 여기에 표시됩니다(직접 입력 가능)",go:"답변 만들기",clr:"지우기",set:"설정(호텔 정보·API 키)",key:"Anthropic API 키",model:"모델 이름",terms:"용어집(자주 잘못 인식되는 말과 정확한 뜻)",info:"호텔 정보(위치·시간·규칙·FAQ)",save:"저장",exp:"내보내기",imp:"가져오기",saved:"저장했습니다",priv:"설정은 이 기기의 브라우저에만 저장됩니다. 손님 이름·객실 번호·카드 정보는 입력하지 마세요. AI 답변은 직원이 확인한 뒤 사용하세요.",mic:"마이크는 선택한 손님 언어로 인식합니다. 언어를 모를 땐 글자로 입력하면 자동 감지합니다.",heard:"손님 발언",fix:"인식 보정",free:"Gemini 무료 티어로 보낸 내용은 Google 제품 개선에 사용될 수 있습니다. 이름·객실 번호·카드 정보는 절대 입력하지 말고 회사 허가를 확인하세요. 모델 이름은 Google AI Studio에서 확인한 이름으로 바꿀 수 있습니다.",said:"의미",speak:"읽기",copy:"복사",noKey:"설정에서 API 키를 입력하세요",listen:"듣는 중…",fail:"오류",nomic:"이 브라우저는 음성 인식을 지원하지 않습니다. 직접 입력하세요.",auto:"자동 감지(입력)",busy:"생각 중…"}};
const DEF_TERMS=`Golf Front / ゴルフフロント = ゴルフ受付カウンター(要書き換え)
(例)Oshima = 大島(海の向こうに見える島)
(誤認識されやすい言葉と正しい意味をここに足してください)`;
const DEF_INFO=`【ホテル名】カワナホテル(例。実際の情報に書き換えてください)
【チェックイン/アウト】IN 00:00 / OUT 00:00
【朝食】場所:___ 時間:___ 料金:___
【大浴場】場所:___ 時間:___ タオル:___
【レストラン・バー】名称/場所/営業時間:___
【駐車場・送迎バス】___
【Wi-Fi】___
【ルール】禁煙/ペット/門限など:___
【周辺案内】駅・観光地・コンビニまで:___
【対応できないこと】料金交渉・個別予約変更などはフロントで確認`;
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const DEFM={c:"claude-sonnet-4-6",g:"gemini-flash-latest"};
let cfg={p:ls.get("p")||"c",key:ls.get("key")||"",model:ls.get("model")||DEFM.c,keyG:ls.get("keyG")||"",modelG:ls.get("modelG")||DEFM.g,info:ls.get("info")||DEF_INFO,terms:ls.get("terms")||DEF_TERMS,g:ls.get("g")||"en",s:ls.get("s")||"ja"};
const ui=()=>UI[cfg.s]||UI.en;
const cur=()=>cfg.p==="g"?{k:"keyG",m:"modelG"}:{k:"key",m:"model"};
function stash(){const c=cur();cfg[c.k]=$("key").value.trim();cfg[c.m]=$("model").value.trim()||DEFM[cfg.p]}
function fillLangs(){
  $("gLang").innerHTML=`<option value="auto">${ui().auto}</option>`+LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join("");
  $("sLang").innerHTML=LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join("");
  $("gLang").value=cfg.g;$("sLang").value=cfg.s;
}
function render(){
  const u=ui();document.documentElement.lang=cfg.s;
  $("ttl").textContent=u.t;$("lGuest").textContent=u.g;$("lStaff").textContent=u.s;
  $("heard").placeholder=u.ph;$("go").textContent=u.go;$("clr").textContent=u.clr;
  $("sumSet").textContent=u.set;$("lProv").textContent="AI";$("prov").value=cfg.p;$("lKey").textContent=(cfg.p==="g"?"Gemini":"Anthropic")+" API key";$("lModel").textContent=u.model;$("pnote").textContent=cfg.p==="g"?u.free:"";
  $("lInfo").textContent=u.info;$("save").textContent=u.save;$("exp").textContent=u.exp;$("imp").textContent=u.imp;
  $("priv").textContent=u.priv;$("micNote").textContent=u.mic;
  $("key").value=cfg[cur().k];$("model").value=cfg[cur().m];$("info").value=cfg.info;$("terms").value=cfg.terms;$("lTerms").textContent=u.terms;
}
fillLangs();render();
$("gLang").onchange=e=>{cfg.g=e.target.value;ls.set("g",cfg.g)};
$("sLang").onchange=e=>{cfg.s=e.target.value;ls.set("s",cfg.s);fillLangs();render();
  if(window._d&&window._d.replies&&$("heard").value.trim()){window._keep=window._d.replies.map(r=>r.guest);$("go").click()}};
$("prov").onchange=e=>{stash();cfg.p=e.target.value;ls.set("p",cfg.p);render()};
$("save").onclick=()=>{stash();cfg.info=$("info").value;ls.set("p",cfg.p);
  cfg.terms=$("terms").value;["key","model","keyG","modelG","info","terms"].forEach(k=>ls.set(k,cfg[k]));$("err").textContent="";alert(ui().saved)};
$("exp").onclick=()=>{const b=new Blob([JSON.stringify({info:$("info").value,terms:$("terms").value},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hotel-info.json";a.click()};
$("imp").onclick=()=>$("file").click();
$("file").onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(j.info)$("info").value=j.info;if(j.terms)$("terms").value=j.terms}catch(x){$("err").textContent=ui().fail}};
$("clr").onclick=()=>{window._d=null;$("heard").value="";$("out").innerHTML="";$("err").textContent=""};

/* Speech recognition */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,on=false,alts=[];
$("heard").oninput=()=>{alts=[]};
$("mic").onclick=()=>{
  if(!SR){$("err").textContent=ui().nomic;return}
  if(on){rec&&rec.stop();return}
  const g=cfg.g==="auto"?"en":cfg.g;
  rec=new SR();rec.lang=(LANGS.find(l=>l[0]===g)||LANGS[1])[2];rec.interimResults=true;rec.maxAlternatives=3;rec.continuous=false;
  rec.onstart=()=>{on=true;$("mic").classList.add("on");$("err").textContent=ui().listen};
  rec.onresult=e=>{$("heard").value=[...e.results].map(r=>r[0].transcript).join("");alts=[...e.results[0]].slice(1).map(a=>a.transcript)};
  rec.onerror=e=>{$("err").textContent=ui().fail+": "+e.error};
  rec.onend=()=>{on=false;$("mic").classList.remove("on");if($("err").textContent===ui().listen)$("err").textContent="";
    if($("heard").value.trim())$("go").click()};
  rec.start();
};

/* Generate */
const nameOf=c=>(LANGS.find(l=>l[0]===c)||[0,c])[1];
function fetchT(u,o,ms=45000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t))}
$("go").onclick=async()=>{
  const text=$("heard").value.trim();if(!text)return;
  if(!cfg[cur().k]){$("err").textContent=ui().noKey;return}
  $("err").textContent=ui().busy;$("go").disabled=true;
  const t0=Date.now(),tm=setInterval(()=>{$("err").textContent=ui().busy+" "+Math.round((Date.now()-t0)/1000)+"s"},1000);
  const staff=nameOf(cfg.s);const keep=window._keep;window._keep=null;
  const guestHint=cfg.g==="auto"?"Detect the guest's language from the text.":`The guest likely speaks ${nameOf(cfg.g)}, but trust the text if it differs.`;
  const system=`You are a hotel front-desk reply assistant. A guest said something; the staff member (who speaks ${staff}) needs three reply options.
${guestHint}
Use ONLY the hotel info below for facts (places, hours, prices, rules). If the info does not cover it, do not invent: offer to check with the front desk/colleague instead.
The input comes from speech recognition (or typing) and often has mishearings, especially hotel/golf/Japanese place terms (e.g. "golf front" heard as "girlfriend"). First correct it using the GLOSSARY, the hotel info and the hotel context (a resort hotel with a golf course), then answer based on the corrected meaning.${alts.length?" Alternative recognitions: "+alts.join(" | "):""}
Return ONLY valid JSON, no markdown:
{"guest_lang_code":"<BCP47>","guest_lang_name":"<name>","heard_fixed":"<corrected transcript in the guest's language>","meaning":"<what the guest said/wants, in ${staff}>","replies":[{"label":"<short label in ${staff}>","guest":"<reply in the guest's language>","pron":"<pronunciation>","staff":"<same reply translated into ${staff}>"}, x3]}
The three replies differ in approach: (1) polite and standard, (2) short and simple (easy for non-native speakers), (3) helpful with extra info or an alternative / confirmation question.
Every reply MUST have a non-empty "staff" field: the full translation of that reply into ${staff} (never in the guest's language, never omitted).
"pron" = how to read the guest-language reply aloud, written phonetically in the script of ${staff} (e.g. katakana for Japanese, hangul for Korean) so the staff can say it. Use "" only if the guest language is the same as ${staff}.
${keep?"KEEP the guest-language replies EXACTLY as given below (same three, same order, unchanged). Only redo label, pron, staff, meaning and heard_fixed for the new staff language ("+staff+"). Guest replies: "+JSON.stringify(keep)+"\n":""}GLOSSARY:
${cfg.terms}
HOTEL INFO:
${cfg.info}`;
  try{
    let raw;
    if(cfg.p==="g"){
      const call=async gc=>{
        const r=await fetchT("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(cfg.modelG)+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":cfg.keyG},
          body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:"user",parts:[{text}]}],generationConfig:gc})});
        return [r,await r.json()]};
      const J={responseMimeType:"application/json",maxOutputTokens:4000};
      let r,d;for(const gc of [{...J,thinkingConfig:{thinkingBudget:0}},J,{}]){[r,d]=await call(gc);if(r.status!==400)break}
      if(!r.ok)throw new Error(d.error&&d.error.message||r.status);
      raw=(((d.candidates||[])[0]||{}).content||{parts:[]}).parts.map(p=>p.text||"").join("");
    }else{
      const r=await fetchT("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:cfg.model,max_tokens:2500,system,messages:[{role:"user",content:text}]})});
      const d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message||r.status);
      raw=d.content.map(c=>c.text||"").join("");
    }
    raw=raw.replace(/```json|```/g,"").trim();
    show(JSON.parse(raw));$("err").textContent="";
  }catch(e){$("err").textContent=ui().fail+": "+(e.name==="AbortError"?"timeout (45s)":e.message)}
  clearInterval(tm);$("go").disabled=false;
};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function show(d){
  const u=ui();window._d=d;window._r=d.replies||[];
  const lc=d.guest_lang_code||"en";
  $("out").innerHTML=`<div class="gloss">${d.heard_fixed&&d.heard_fixed.trim()!==$("heard").value.trim()?`<span class="tag">${u.fix}</span><br>${esc(d.heard_fixed)}<br><br>`:""}<span class="tag">${u.said} (${esc(d.guest_lang_name||lc)})</span><br>${esc(d.meaning||"")}</div>`+
  window._r.map((r,i)=>`<div class="card"><div class="tag">${esc(r.label)}</div><div class="guest" lang="${esc(lc)}">${esc(r.guest)}</div>${r.pron?`<div class="pron" aria-label="pronunciation">🗣 ${esc(r.pron)}</div>`:""}<div class="staff"><span class="tag">${u.said}</span> ${esc(r.staff)}</div>
  <div class="row"><button data-s="${i}">🔊 ${u.speak}</button><button data-c="${i}">${u.copy}</button></div></div>`).join("");
  $("out").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.s){speechSynthesis.cancel();const ut=new SpeechSynthesisUtterance(window._r[b.dataset.s].guest);ut.lang=lc;speechSynthesis.speak(ut)}
    if(b.dataset.c){navigator.clipboard&&navigator.clipboard.writeText(window._r[b.dataset.c].guest)}};
}
</script>
</body>
</html>
